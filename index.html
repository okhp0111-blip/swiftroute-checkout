<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftRoute Checkout Panel</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full bg-gray-800 rounded-xl p-8 shadow-2xl border border-gray-700">
        <h2 class="text-2xl font-bold mb-2 text-indigo-400">SwiftRoute Checkout</h2>
        <p class="text-gray-400 text-sm mb-6">Complete your high-speed payment configuration instantly.</p>
        
        <div class="bg-gray-950 p-4 rounded-lg mb-6 border border-gray-800">
            <div class="flex justify-between mb-2">
                <span class="text-gray-400">Route Package:</span>
                <span class="font-semibold text-white">Enterprise Core</span>
            </div>
            <div class="flex justify-between text-lg font-bold">
                <span>Total Due:</span>
                <span class="text-emerald-400">$299.00</span>
            </div>
        </div>

        <button id="checkoutBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 px-4 rounded-lg transition-all shadow-lg shadow-indigo-600/30">
            Initialize Payment Session
        </button>

        <div id="statusBox" class="mt-4 p-3 text-center text-sm rounded-lg hidden"></div>
    </div>

    <script>
        const btn = document.getElementById('checkoutBtn');
        const statusBox = document.getElementById('statusBox');

        btn.addEventListener('click', async () => {
            btn.disabled = true;
            btn.innerText = "Processing...";
            
            try {
                const res = await fetch('/api/v1/checkout/session', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount: 299.00, currency: 'USD', route_id: 'sr_ent_09' })
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    statusBox.className = "mt-4 p-3 text-center text-sm rounded-lg bg-emerald-950 text-emerald-300 border border-emerald-800";
                    statusBox.innerHTML = `Session Created!<br><span class="font-mono text-xs">ID: ${data.session_id}</span>`;
                } else {
                    throw new Error(data.detail || "Checkout failed.");
                }
            } catch (err) {
                statusBox.className = "mt-4 p-3 text-center text-sm rounded-lg bg-rose-950 text-rose-300 border border-rose-800";
                statusBox.innerText = err.message;
            } finally {
                statusBox.classList.remove('hidden');
                btn.disabled = false;
                btn.innerText = "Initialize Payment Session";
            }
        });
    </script>
</body>
</html>
